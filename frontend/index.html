<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navee</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("navee.theme");
          if (t !== "light" && t !== "dark") {
            t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          if (t === "dark") document.documentElement.classList.add("dark");
          var f = parseInt(localStorage.getItem("navee.fontScale") || "100", 10);
          if (!isNaN(f) && f >= 80 && f <= 140) document.documentElement.style.fontSize = f + "%";
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
